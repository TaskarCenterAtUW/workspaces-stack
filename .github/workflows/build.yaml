name: "Build Images"
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'     
        required: true
        default: 'dev'

jobs:
  build:
    runs-on: ubuntu-latest 
    name: Image Build 
    environment: "dev"
    timeout-minutes: 45
    steps:
        - uses: actions/checkout@v2
          with:
            submodules: recursive
        
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            registry: ${{ vars.WS_DOCKER_REGISTRY }}
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
                  
        - name: Set commit SHA as code version
          run: echo "CODE_VERSION=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV



        - name: Setup Docker Context
          run: |
            mkdir -p ~/.ssh
              echo "${{ secrets.GH_ACTIONS_SSH_KEY }}" > ~/.ssh/github_actions
              chmod 600 ~/.ssh/github_actions
              ssh-add ~/.ssh/github_actions		  
              docker context create dev2 --docker "host=ssh://root@52.156.141.168"
              docker context use dev2
              docker ps

    